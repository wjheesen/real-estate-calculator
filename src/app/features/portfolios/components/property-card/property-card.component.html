<article>
  @let row = property();
  <header>
    <h3><a routerLink="/calculator" [queryParams]="{ id: row.id }">{{ row.name }}</a></h3>
    <span class="status">{{ status() }}</span>
  </header>
  @if (row.description) { <p class="description">{{ row.description }}</p> }
  @if (figures().length) {
    <dl>
      @for (figure of figures(); track figure.label) {
        <div><dt>{{ figure.label }}</dt><dd>{{ figure.value }}</dd></div>
      }
    </dl>
  } @else {
    <p role="alert">This property could not be calculated.</p>
  }
  <div class="actions">
    <a mat-button routerLink="/calculator" [queryParams]="{ id: row.id }" [attr.aria-label]="'Edit ' + row.name">Edit</a>
    <button mat-button type="button" [attr.aria-disabled]="busy()" [attr.aria-label]="'Copy ' + row.name"
      (click)="copied.emit()">Copy</button>
    <button mat-button type="button" [attr.aria-disabled]="busy()" [attr.aria-label]="'Duplicate ' + row.name"
      (click)="duplicated.emit()">Duplicate</button>
    <button mat-button type="button" [attr.aria-disabled]="busy()" [attr.aria-label]="'Delete ' + row.name"
      (click)="deleted.emit()">Delete</button>
  </div>
</article>
