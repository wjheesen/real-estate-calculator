<header class="app-header">
  <div class="shell">
    <p class="app-title">Real Estate Calculator</p>

    <div class="app-actions" role="group" aria-label="App controls">
      <button
        mat-stroked-button
        type="button"
        [attr.aria-pressed]="theme() === 'dark'"
        [disabled]="themeBusy()"
        (click)="toggleTheme()"
      >
        Dark mode
      </button>
      <button mat-button type="button" disabled>Settings</button>
      <button mat-button type="button" disabled>Import</button>
      <button mat-button type="button" disabled>Export</button>
    </div>

    <nav class="app-nav" aria-label="Main navigation">
      <a mat-button routerLink="/budget" routerLinkActive="active" ariaCurrentWhenActive="page">
        Budget
      </a>
      <a mat-button routerLink="/calculator" routerLinkActive="active" ariaCurrentWhenActive="page">
        Calculator
      </a>
      <a mat-button routerLink="/portfolios" routerLinkActive="active" ariaCurrentWhenActive="page">
        Portfolios
      </a>
    </nav>
  </div>
</header>

<main class="shell app-main">
  @if (themeError()) {
    <p class="app-error" role="alert">{{ themeError() }}</p>
  }
  <router-outlet />
</main>
