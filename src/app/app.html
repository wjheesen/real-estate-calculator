<header class="app-header">
  <div class="container">
    <h1 class="app-title">{{ title }}</h1>
    <nav class="app-nav">
      <a routerLink="/calculator" routerLinkActive="active" class="nav-link">Calculator</a>
      <a routerLink="/portfolios" routerLinkActive="active" class="nav-link">Portfolio</a>
      <a routerLink="/settings" routerLinkActive="active" class="nav-link">Settings</a>
    </nav>
    <div class="app-actions" *ngIf="isCloudStorageAvailable">
      <button mat-icon-button 
              color="accent" 
              (click)="downloadFromCloud()" 
              [disabled]="cloudOperationInProgress"
              matTooltip="Import application data and settings from ZIP file">
        <mat-icon>upload</mat-icon>
      </button>
      <button mat-icon-button 
              color="primary" 
              (click)="uploadToCloud()" 
              [disabled]="cloudOperationInProgress"
              matTooltip="Export all application data and settings as ZIP file">
        <mat-icon>download</mat-icon>
      </button>
    </div>
  </div>
</header>

<main class="app-main">
  <router-outlet></router-outlet>
</main>
