<header class="app-header">
  <div class="shell">
    <p class="app-title">Real Estate Calculator</p>

    <div class="app-actions" role="group" aria-label="App controls">
      <button
        mat-stroked-button
        type="button"
        [attr.aria-pressed]="theme() === 'dark'"
        [disabled]="themeBusy()"
        (click)="toggleTheme()"
      >
        Dark mode
      </button>
      <button mat-button type="button" [disabled]="backupBlocked()"
        (click)="openSettings()">Settings</button>
      <button mat-button type="button" [disabled]="backupBlocked()" (click)="importBackup()">Import</button>
      <button mat-button type="button" [disabled]="backupBlocked()" (click)="exportBackup()">Export</button>
    </div>

    <nav class="app-nav" aria-label="Main navigation">
      <a mat-button routerLink="/budget" routerLinkActive="active" ariaCurrentWhenActive="page">
        Budget
      </a>
      <a mat-button routerLink="/calculator" routerLinkActive="active" ariaCurrentWhenActive="page">
        Calculator
      </a>
      <a mat-button routerLink="/portfolios" routerLinkActive="active" ariaCurrentWhenActive="page">
        Portfolios
      </a>
    </nav>
  </div>
</header>

<main class="shell app-main">
  @if (settingsError()) {
    <p class="app-error" role="alert">{{ settingsError() }}</p>
  }
  @if (backupError()) {
    <p class="app-error" role="alert">{{ backupError() }}</p>
  }
  @if (refreshRequired()) {
    <button mat-stroked-button type="button" [disabled]="backupBusy()" (click)="refreshBackup()">
      Refresh imported data
    </button>
  }
  <router-outlet />
</main>
