<h2 mat-dialog-title>Copy property</h2>
<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content>
    <mat-form-field appearance="outline">
      <mat-label>Target portfolio</mat-label>
      <mat-select formControlName="portfolioId" required>
        @for (portfolio of data.portfolios; track portfolio.id) {
          <mat-option [value]="portfolio.id">{{ portfolio.name }}</mat-option>
        }
      </mat-select>
      <mat-error>Select a target portfolio.</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>New name (optional)</mat-label>
      <input matInput formControlName="name">
      <mat-hint>Leave blank to keep the original name.</mat-hint>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" [mat-dialog-close]="undefined">Cancel</button>
    <button mat-flat-button type="submit" [disabled]="!data.portfolios.length">Copy</button>
  </mat-dialog-actions>
</form>
