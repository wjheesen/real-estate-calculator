<h2 mat-dialog-title>{{ data.title }}</h2>
<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content>
    <mat-form-field appearance="outline">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" required cdkFocusInitial>
      @if (form.controls.name.hasError('required')) {
        <mat-error>Enter a name.</mat-error>
      } @else if (form.controls.name.hasError('duplicate')) {
        <mat-error>This name is already in use.</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Description (optional)</mat-label>
      <textarea matInput formControlName="description" rows="2"></textarea>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" [mat-dialog-close]="undefined">Cancel</button>
    <button mat-flat-button type="submit">{{ data.submitLabel ?? 'Save' }}</button>
  </mat-dialog-actions>
</form>
